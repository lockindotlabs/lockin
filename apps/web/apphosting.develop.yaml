# apps/web/apphosting.develop.yaml
yamlVersion: v1beta

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: develop
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    secret: NEXT_PUBLIC_APP_URL_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_IN_URL_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_UP_URL_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_WEBHOOK_SECRET
    secret: CLERK_WEBHOOK_SECRET_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY_DEVELOP
    availability:
      - RUNTIME

  - variable: TAVILY_API_KEY
    secret: TAVILY_API_KEY_DEVELOP
    availability:
      - BUILD
      - RUNTIME

  - variable: DATABASE_URL
    secret: DATABASE_URL_DEVELOP
    availability:
      - RUNTIME

  - variable: DIRECT_URL
    secret: DIRECT_URL_DEVELOP
    availability:
      - RUNTIME

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
