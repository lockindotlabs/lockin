# apps/web/apphosting.production.yaml
yamlVersion: v1beta

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://lockin.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_IN_URL_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_UP_URL_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
    secret: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_WEBHOOK_SECRET
    secret: CLERK_WEBHOOK_SECRET_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY_PRODUCTION
    availability:
      - RUNTIME

  - variable: TAVILY_API_KEY
    secret: TAVILY_API_KEY_PRODUCTION
    availability:
      - BUILD
      - RUNTIME

runConfig:
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 1024
