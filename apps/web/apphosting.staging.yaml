# apps/web/apphosting.staging.yaml

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.lockin.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STAGING
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY_STAGING
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY_STAGING
    availability:
      - RUNTIME

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
